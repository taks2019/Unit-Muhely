name: APK építés

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # A UnityPy C-bővítmény nélküli (tiszta Python) része kerül az appba
      - name: UnityPy beillesztése
        run: |
          pip download UnityPy==1.9.28 --no-deps --no-binary :all: -d /tmp/up
          tar xzf /tmp/up/*.tar.gz -C /tmp/up
          cp -r /tmp/up/UnityPy-1.9.28/UnityPy app/src/main/python/UnityPy
          rm -rf app/src/main/python/UnityPy/lib

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Építés
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: UnityMuhely-apk
          path: app/build/outputs/apk/debug/*.apk
